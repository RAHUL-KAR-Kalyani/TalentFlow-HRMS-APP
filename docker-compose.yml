# version: "3.9"

services:
    mongo:
        image: mongo:latest

        restart: always

        ports:
            - "27017:27017"

        volumes:
            - mongo-data:/data/db

    server:
        build: ./server

        restart: always

        ports:
            - "8000:8000"

        depends_on:
            - mongo

        environment:
            MONGO_URI: ${MONGO_URI}
            JWT_SECRET: ${SECRET_KEY}

        volumes:
            - ./server:/app
            - /app/node_modules

    client:
        build: ./client

        restart: always

        ports:
            - "5173:5173"

        depends_on:
            - server

        volumes:
            - ./client:/app
            - /app/node_modules

volumes:
    mongo-data:
