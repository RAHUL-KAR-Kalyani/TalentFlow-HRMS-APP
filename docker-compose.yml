version: "3.9"

services:
    mongo:
        image: mongo:latest
        container_name: mongo

        restart: always

        ports:
            - "27017:27017"

        volumes:
            - mongo-data:/data/db

    server:
        build: ./server

        container_name: backend

        restart: always

        ports:
            - "8000:8000"

        depends_on:
            - mongo

        environment:
            MONGO_URI: mongodb+srv://rahul:rahulkar@authapp.v96x4ah.mongodb.net/inventory-billing
            JWT_SECRET: "this is auth app"

        volumes:
            - ./server:/app
            - /app/node_modules

    client:
        build: ./client

        container_name: frontend

        restart: always

        ports:
            - "5173:5173"

        depends_on:
            - server

        volumes:
            - ./client:/app
            - /app/node_modules

volumes:
    mongo-data:
